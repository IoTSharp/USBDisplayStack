name: build

on:
  push:
  pull_request:

jobs:
  userspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build userspace and tools
        run: make userspace
      - name: Test readiness checker
        run: make check
      - name: Smoke-test plugin loading
        run: build/usb-displayd --help || test $? -eq 1

  kernel-4-15:
    runs-on: ubuntu-latest
    container: ubuntu:18.04
    steps:
      - name: Install Linux 4.15 build dependencies
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates git linux-headers-generic
      - name: Check out the triggering revision
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Build module
        run: |
          KDIR=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)
          test -n "$KDIR"
          make module KDIR="$KDIR"
